<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="brand/encore-icon.svg" type="image/svg+xml"><link rel="icon" href="brand/encore-icon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="brand/encore-icon-180.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credits · ENCORE. Studio</title>
<meta name="description" content="Every song&#39;s codes, credits, splits and registrations in one place, explained in plain words, with split sheets and backups. Stays in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="encore-tokens.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--family-primary); -webkit-font-smoothing: antialiased; }
  .hidden { display: none !important; }
  .bar { position: sticky; top: 0; z-index: 10; height: 60px; display: flex; align-items: center; gap: 14px; padding: 0 clamp(16px, 2.5vw, 32px);
         background: rgb(12 10 9 / 0.94); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--divider); }
  .wordmark { height: 24px; width: auto; color: var(--text); display: block; flex: none; }
  .chip-label { font-size: 11px; letter-spacing: .06em; color: var(--soft); border: 1px solid var(--divider-strong); border-radius: 4px; padding: 3px 6px; line-height: 1; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: #ff8a5c; }
  .muted { color: var(--soft); } .dim { color: var(--dim); } .small { font-size: 12.5px; }

  /* one screen: the catalog, the song, help and what's missing */
  main { --e: max(0px, (100vw - 1600px) / 2); padding: 12px 14px 14px; display: grid; grid-template-columns: calc(250px + var(--e)) minmax(0, 1fr) calc(340px + var(--e)); gap: 12px; height: calc(100vh - 60px); }
  .panel { background: var(--panel); border: 1px solid var(--divider); border-radius: 14px; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--divider); }
  .head h2 { margin: 0; font-size: 15px; font-weight: 800; flex: 1 1 auto; }
  .scroll { overflow-y: auto; min-height: 0; flex: 1 1 auto; }
  .btn { border: 1px solid var(--divider-strong); background: transparent; border-radius: 999px; padding: 6px 13px; font-weight: 700; font-size: 13px; min-height: 34px; white-space: nowrap; }
  .btn:hover { border-color: var(--soft); }
  .btn.go { background: #ff3b00; border-color: #ff3b00; color: #fff; }
  .btn.sm { min-height: 28px; padding: 3px 10px; font-size: 12.5px; }
  .btn.danger { color: #ff8a8a; }
  .ib { width: 30px; height: 30px; border: 0; background: transparent; color: var(--soft); border-radius: 8px; display: inline-grid; place-items: center; font-size: 15px; flex: none; }
  .ib:hover { background: rgb(255 255 255 / .07); color: var(--text); }
  .seg { display: inline-flex; padding: 3px; border: 1px solid var(--divider-strong); border-radius: 999px; gap: 2px; flex: none; }
  .seg button { border: 0; background: transparent; color: var(--soft); font-size: 13px; font-weight: 700; padding: 4px 11px; border-radius: 999px; white-space: nowrap; }
  .seg button.on { background: #ff3b00; color: #fff; }
  input.t, select.t, textarea.t { background: var(--bg-subtle-default); border: 1px solid var(--divider-strong); border-radius: 8px; padding: 5px 8px; font-size: 13.5px; min-width: 0; width: 100%; }
  textarea.t { resize: vertical; min-height: 54px; }
  input.t:focus, select.t:focus, textarea.t:focus { outline: 2px solid #ff3b00; outline-offset: -1px; }
  input.t.bad { border-color: var(--warn); } input.t.good { border-color: rgb(123 211 164 / .55); }
  input.mono { font-family: var(--family-mono); font-size: 13px; letter-spacing: .02em; }
  input.mono::placeholder { font-family: var(--family-primary); letter-spacing: 0; }
  #delSong, #delRel { font-size: 17px; }
  .hint { font-size: 12.5px; color: var(--dim); padding: 7px 12px; border-top: 1px solid var(--divider); display: flex; gap: 8px; align-items: center; }
  .hint b { color: var(--soft); }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #ff3b00; color: #fff; font-weight: 700; padding: 9px 18px; border-radius: 999px; z-index: 80; box-shadow: 0 8px 30px rgb(0 0 0 / .4); max-width: 92vw; text-align: center; }
  .mtabs { display: none; }

  /* catalog */
  .quick { display: flex; gap: 6px; padding: 10px 10px 6px; }
  .quick input { flex: 1 1 auto; }
  .drop { margin: 2px 10px 6px; border: 1px dashed var(--divider-strong); border-radius: 10px; padding: 7px 10px; font-size: 12.5px; color: var(--soft); text-align: center; background: transparent; width: calc(100% - 20px); line-height: 1.35; }
  .drop b { color: var(--text); }
  .drop:hover, #catPanel.dragging .drop { border-color: #ff3b00; color: var(--text); background: rgb(255 59 0 / .08); }
  input.t.search { margin: 0 10px 6px; width: calc(100% - 20px); }
  .list { padding: 0 6px 10px; }
  .grp { margin-top: 6px; }
  .ghead { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: transparent; text-align: left; padding: 6px 6px; border-radius: 8px; }
  .ghead:hover { background: rgb(255 255 255 / .05); }
  .ghead.on { background: rgb(255 59 0 / .14); box-shadow: inset 2px 0 0 #ff3b00; }
  .ghead .cov { width: 30px; height: 30px; border-radius: 5px; flex: none; object-fit: cover; background: var(--bg-surface-strong); display: grid; place-items: center; font-size: 13px; color: var(--dim); }
  .ghead .gt { min-width: 0; flex: 1 1 auto; line-height: 1.2; }
  .ghead .gt b { display: block; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ghead .gt span { font-size: 11.5px; color: var(--dim); }
  .glabel { font-size: 11.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); padding: 10px 8px 2px; }
  .srow { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; border: 0; background: transparent; padding: 5px 8px 5px 12px; border-radius: 8px; font-size: 14px; }
  .srow:hover { background: rgb(255 255 255 / .05); }
  .srow.on { background: rgb(255 59 0 / .14); color: #fff; box-shadow: inset 2px 0 0 #ff3b00; }
  .srow .tn { width: 16px; font: 11px var(--family-mono); color: var(--dim); flex: none; }
  .srow .nm { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .srow .pg { font: 11px var(--family-mono); color: var(--dim); flex: none; }
  .srow .pg.full { color: var(--green); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); flex: none; }
  .lempty { color: var(--dim); font-size: 13px; padding: 14px 10px; }

  /* the song */
  .songHead { padding: 10px 14px 0; display: grid; gap: 6px; }
  .titleRow { display: flex; gap: 8px; align-items: center; }
  .titleIn { flex: 1 1 auto; min-width: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.01em; background: transparent; border: 0; padding: 2px 0; }
  .titleIn:focus, .verIn:focus { outline: none; box-shadow: 0 2px 0 #ff3b00; }
  .verIn { width: 150px; flex: none; background: transparent; border: 0; border-bottom: 1px solid var(--divider-strong); padding: 2px 0; color: var(--soft); font-size: 14px; }
  .pill { font-size: 12px; font-weight: 800; border-radius: 999px; padding: 3px 10px; border: 1px solid var(--divider-strong); white-space: nowrap; color: var(--soft); flex: none; }
  .pill.full { color: var(--green); border-color: rgb(123 211 164 / .45); }
  .actRow { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--soft); }
  .actRow select.t { width: auto; max-width: 240px; padding: 3px 6px; font-size: 13px; }
  .actRow .sp { flex: 1 1 auto; }
  .stabs { display: flex; gap: 2px; margin: 6px -14px 0; padding: 0 10px; border-bottom: 1px solid var(--divider); overflow-x: auto; scrollbar-width: none; }
  .stabs::-webkit-scrollbar { display: none; }
  .stabs button { flex: none; border: 0; background: transparent; color: var(--soft); font-weight: 800; font-size: 13.5px; padding: 8px 10px 9px; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .stabs button.on { color: var(--text); border-bottom-color: #ff3b00; }
  .stabs button .bd { display: inline-block; min-width: 7px; height: 7px; border-radius: 50%; background: var(--warn); margin-left: 5px; vertical-align: 2px; }
  .body { padding: 12px 14px 20px; }
  .intro { font-size: 13.5px; color: var(--soft); margin: 0 0 10px; max-width: 760px; }
  .intro b { color: var(--text); }
  .fgrid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px 12px; }
  .fl { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--soft); font-weight: 700; min-width: 0; grid-column: span 2; }
  .fl.w3 { grid-column: span 3; } .fl.w6 { grid-column: 1 / -1; } .fl.w1 { grid-column: span 1; }
  .fl > .t { color: var(--text); font-weight: 400; }
  .msg { font-size: 12px; font-weight: 600; min-height: 0; color: var(--warn); }
  .msg:empty { display: none; }
  .msg.ok { color: var(--green); }
  .code { grid-column: span 3; border: 1px solid var(--divider); border-radius: 12px; padding: 9px 10px; display: grid; gap: 4px; background: rgb(255 255 255 / .015); }
  .code .lab { font-size: 12px; font-weight: 800; color: var(--text); }
  .code .lab span { font-weight: 600; color: var(--dim); }
  .code .ex { font-size: 12px; color: var(--dim); line-height: 1.4; }
  .seg.full { display: flex; } .seg.full button { flex: 1 1 0; }

  /* splits */
  .splitbox { border: 1px solid var(--divider); border-radius: 12px; padding: 9px 11px; margin-bottom: 10px; }
  .sbar { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: var(--bg-surface-strong); }
  .sbar i { display: block; height: 100%; min-width: 2px; border-right: 2px solid var(--panel); }
  .sbar i.over { background: repeating-linear-gradient(45deg, var(--red), var(--red) 6px, #b91c1c 6px, #b91c1c 12px) !important; }
  .slegend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--soft); margin-top: 6px; }
  .slegend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 3px; background: var(--c); margin-right: 5px; vertical-align: -1px; }
  .stotal { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; margin-bottom: 7px; font-size: 13.5px; }
  .stotal b { font-size: 15px; }
  .stotal.ok b { color: var(--green); } .stotal.bad b { color: var(--warn); }
  .stotal .smsg { color: var(--soft); font-size: 12.5px; text-align: right; }
  .stotal.bad .smsg { color: var(--warn); }
  .card { border: 1px solid var(--divider); border-radius: 12px; padding: 9px 10px; margin-bottom: 8px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 8px 10px; align-items: end; position: relative; border-left: 3px solid var(--c, var(--divider-strong)); }
  .card .fl { grid-column: span 3; } .card .fl.c2 { grid-column: span 2; } .card .fl.c4 { grid-column: span 4; } .card .fl.c5 { grid-column: span 5; } .card .fl.c6 { grid-column: span 6; } .card .fl.c12 { grid-column: 1 / -1; }
  .card .del { position: absolute; top: 3px; right: 3px; width: 26px; height: 26px; font-size: 13px; }
  .card .pad { padding-right: 26px; }
  .shareIn { position: relative; } .shareIn input { padding-right: 22px; text-align: right; font-weight: 700; } .shareIn::after { content: "%"; position: absolute; right: 8px; bottom: 6px; color: var(--dim); font-size: 13px; pointer-events: none; }
  .rowbtns { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 4px 0 6px; }
  .quickroles { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; font-size: 12.5px; color: var(--soft); }
  .none { color: var(--dim); font-size: 13.5px; border: 1px dashed var(--divider-strong); border-radius: 12px; padding: 14px; text-align: center; margin-bottom: 8px; }

  /* registrations */
  .reg { border: 1px solid var(--divider); border-left: 3px solid var(--divider-strong); border-radius: 12px; padding: 9px 11px; margin-bottom: 8px; }
  .reg.st-doing { border-left-color: var(--warn); } .reg.st-done { border-left-color: var(--green); } .reg.st-na { opacity: .62; }
  .reg.flash, .card.flash, .code.flash { box-shadow: 0 0 0 2px #ff3b00; }
  .rtop { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .rtop h3 { margin: 0; font-size: 14.5px; font-weight: 800; flex: 1 1 200px; min-width: 0; }
  .rtop h3 span { font-weight: 600; color: var(--dim); font-size: 12.5px; margin-left: 6px; }
  .reg .seg button { padding: 3px 9px; font-size: 12px; }
  .reg .seg button.on.s-done { background: #059669; } .reg .seg button.on.s-doing { background: #b7791f; } .reg .seg button.on.s-na { background: var(--bg-surface-strong); color: var(--text); }
  .rtext { font-size: 12.5px; color: var(--soft); margin: 5px 0 6px; line-height: 1.45; }
  .rtext .why { color: var(--dim); }
  .rlinks { display: inline-flex; gap: 10px; flex-wrap: wrap; margin-left: 4px; }
  .rfields { display: grid; grid-template-columns: 140px 170px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
  .rfields input.t { padding: 4px 7px; font-size: 13px; }
  .note { font-size: 12px; color: var(--dim); border-top: 1px solid var(--divider); padding-top: 8px; margin-top: 10px; }

  /* release */
  .relTop { display: flex; gap: 14px; align-items: flex-start; }
  .coverBtn { width: 96px; height: 96px; flex: none; border-radius: 10px; border: 1px dashed var(--divider-strong); background: transparent; color: var(--dim); padding: 0; overflow: hidden; display: grid; place-items: center; font-size: 12px; text-align: center; line-height: 1.3; }
  .coverBtn img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tracks { border: 1px solid var(--divider); border-radius: 12px; overflow: hidden; margin: 6px 0 10px; }
  .trk { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-bottom: 1px solid var(--divider); font-size: 14px; }
  .trk:last-child { border-bottom: 0; }
  .trk .n { width: 20px; font: 12px var(--family-mono); color: var(--dim); text-align: right; }
  .trk .nm { flex: 1 1 auto; min-width: 0; border: 0; background: transparent; text-align: left; padding: 3px 4px; border-radius: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trk .nm:hover { background: rgb(255 255 255 / .05); }
  .trk .ib { width: 26px; height: 26px; font-size: 12px; }
  .lbl { font-size: 11.5px; font-weight: 800; color: var(--soft); letter-spacing: .04em; text-transform: uppercase; margin: 16px 0 6px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .lbl:first-child { margin-top: 2px; }
  .lbl .dim { text-transform: none; letter-spacing: 0; font-weight: 600; }

  /* welcome */
  .welcome { max-width: 620px; margin: 4vh auto 0; padding: 0 18px; }
  .welcome h2 { font-size: 26px; margin: 0 0 6px; letter-spacing: -0.01em; }
  .welcome p { color: var(--soft); margin: 0 0 12px; }
  .steps { display: grid; gap: 8px; margin: 14px 0 18px; padding: 0; list-style: none; counter-reset: s; }
  .steps li { border: 1px solid var(--divider); border-radius: 12px; padding: 9px 12px 9px 42px; position: relative; font-size: 14px; color: var(--soft); }
  .steps li b { color: var(--text); }
  .steps li::before { counter-increment: s; content: counter(s); position: absolute; left: 12px; top: 9px; width: 20px; height: 20px; border-radius: 50%; background: #ff3b00; color: #fff; font-size: 12px; font-weight: 800; display: grid; place-items: center; }

  /* right side: to do, help, backup */
  .ttabs { display: flex; gap: 2px; padding: 6px; border-bottom: 1px solid var(--divider); }
  .ttabs button { flex: 1 1 0; border: 0; background: transparent; color: var(--soft); font-weight: 800; font-size: 13.5px; padding: 7px 4px; border-radius: 9px; }
  .ttabs button.on { background: #ff3b00; color: #fff; }
  .side { padding: 10px 12px 16px; }
  .sumbox { border: 1px solid var(--divider); border-radius: 12px; padding: 10px 11px; margin-bottom: 10px; }
  .sumbox .big { font-size: 22px; font-weight: 800; line-height: 1.1; }
  .pbar { height: 8px; border-radius: 999px; background: var(--bg-surface-strong); overflow: hidden; margin: 7px 0 4px; }
  .pbar i { display: block; height: 100%; background: #ff3b00; border-radius: 999px; }
  .nudge { border: 1px solid rgb(232 176 75 / .45); background: rgb(232 176 75 / .07); border-radius: 12px; padding: 9px 11px; font-size: 13px; color: var(--soft); margin-bottom: 10px; }
  .nudge b { color: var(--text); }
  .iss { display: block; width: 100%; text-align: left; border: 1px solid var(--divider); background: transparent; border-radius: 10px; padding: 7px 10px; margin-bottom: 6px; font-size: 13.5px; }
  .iss:hover { border-color: #ff6c40; }
  .iss .it { display: flex; gap: 8px; align-items: baseline; }
  .iss .it::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; transform: translateY(-1px); }
  .iss.fix .it::before { background: var(--warn); }
  .iss .go { font-size: 12px; color: #ff8a5c; font-weight: 700; margin-left: auto; white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 0 16px; }
  .chip { border: 1px solid var(--divider-strong); background: transparent; border-radius: 999px; padding: 1px 8px; font-size: 11.5px; color: var(--soft); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip:hover { color: var(--text); border-color: #ff6c40; }
  .allgood { color: var(--green); font-weight: 700; font-size: 14px; padding: 8px 2px; }
  .gl { font-size: 13px; margin-bottom: 9px; color: var(--soft); line-height: 1.45; }
  .gl b { color: var(--text); }
  .copies { display: grid; gap: 6px; }
  .copy { text-align: left; border: 1px solid var(--divider-strong); background: transparent; border-radius: 10px; padding: 8px 11px; }
  .copy:hover { border-color: #ff6c40; }
  .copy b { display: block; font-size: 14px; } .copy span { display: block; font-size: 12px; color: var(--dim); }
  .copy.danger b { color: #ff8a8a; }

  /* dialogs */
  dialog.dlg { background: var(--panel); color: var(--text); border: 1px solid var(--divider-strong); border-radius: 14px; padding: 16px 18px; width: min(620px, 94vw); max-height: 90vh; overflow: auto; }
  dialog.dlg::backdrop { background: rgb(0 0 0 / .6); }
  dialog.dlg h3 { margin: 0 0 10px; font-size: 17px; }
  .dlg .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; } .dlg .row.end { justify-content: flex-end; margin-top: 12px; }
  pre.preview { font: 12px/1.5 var(--family-mono); background: var(--bg-subtle-default); border: 1px solid var(--divider); border-radius: 10px; padding: 9px 11px; max-height: 46vh; overflow: auto; white-space: pre-wrap; margin: 10px 0 0; }
  dialog.sheetDlg { width: min(900px, 96vw); height: 92vh; max-height: none; padding: 0; display: flex; flex-direction: column; overflow: hidden; }
  dialog.sheetDlg:not([open]) { display: none; }
  .sheetTop { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--divider); }
  .sheetTop h3 { margin: 0; flex: 1 1 auto; font-size: 16px; }
  .paperWrap { flex: 1 1 auto; overflow: auto; background: #57534e; padding: 18px; }
  .paper { background: #fff; color: #111; width: min(794px, 100%); margin: 0 auto; padding: 44px 48px; border-radius: 3px; box-shadow: 0 6px 30px rgb(0 0 0 / .35); }

  /* the split sheet (on paper and printed) */
  .ss { font: 13px/1.45 var(--family-primary); color: #111; }
  .ss-head { display: flex; justify-content: space-between; gap: 16px; border-bottom: 2px solid #111; padding-bottom: 10px; margin-bottom: 12px; }
  .ss-kicker { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #c2410c; }
  .ss h1 { margin: 2px 0 0; font-size: 26px; line-height: 1.15; letter-spacing: -0.01em; }
  .ss-by { font-size: 15px; color: #333; }
  .ss-date { font-size: 12px; color: #555; white-space: nowrap; }
  .ss-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 16px; margin-bottom: 8px; }
  .ss-kv span { display: block; font-size: 10.5px; color: #666; text-transform: uppercase; letter-spacing: .06em; }
  .ss-kv b { font-size: 13px; font-weight: 700; } .ss-kv b.m { font-family: var(--family-mono); font-size: 12.5px; }
  .ss h2 { font-size: 14px; margin: 16px 0 6px; } .ss-note { font-weight: 400; color: #666; font-size: 12px; }
  .ss-t { width: 100%; border-collapse: collapse; }
  .ss-t th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: #555; border-bottom: 1px solid #111; padding: 4px 6px; }
  .ss-t td { border-bottom: 1px solid #ccc; padding: 6px; vertical-align: top; }
  .ss-t tfoot td { border-bottom: 0; border-top: 2px solid #111; font-weight: 800; }
  .ss-t2 { width: 60%; }
