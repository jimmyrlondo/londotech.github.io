<meta name="description" content="Take your songs from finished mix to release in one place: master, tag, check and export every format at once.">

<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--family-primary); -webkit-font-smoothing: antialiased; }
  .hidden { display: none !important; }
  .bar { position: sticky; top: 0; z-index: 10; height: 60px; display: flex; align-items: center; gap: 14px; padding: 0 clamp(16px, 2.5vw, 32px);
         background: rgb(12 10 9 / 0.94); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--divider); }
  .wordmark { height: 24px; width: auto; color: var(--text); display: block; flex: none; }
  .chip-label { font-size: 11px; letter-spacing: .06em; color: var(--soft); border: 1px solid var(--divider-strong); border-radius: 4px; padding: 3px 6px; line-height: 1; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }

  /* one screen: the songs on the left, the step you're on at the right */
  main { max-width: 1400px; margin: 0 auto; padding: 14px 16px 16px; display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 14px; height: calc(100vh - 60px); }
  .panel { background: var(--panel); border: 1px solid var(--divider); border-radius: 14px; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--divider); }
  .head h2 { margin: 0; font-size: 15px; font-weight: 800; letter-spacing: -0.01em; }
  .muted { color: var(--soft); } .dim { color: var(--dim); } .small { font-size: 13px; }
  .scroll { overflow-y: auto; min-height: 0; flex: 1 1 auto; }

  /* songs */
  .drop { margin: 12px; display: flex; align-items: center; gap: 12px; cursor: pointer; border: 1.5px dashed var(--divider-strong); border-radius: 12px; padding: 14px; transition: border-color .15s, background .15s; }
  .drop.over { border-color: #ff3b00; background: var(--bg-surface-hover); }
  .drop svg { flex: none; color: #ff3b00; }
  .drop b { display: block; font-size: 15px; line-height: 1.25; }
  .drop span { color: var(--dim); font-size: 12.5px; }
  .songs { list-style: none; margin: 0; padding: 0 8px 8px; }
  .song { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 8px; border-radius: 10px; }
  .song + .song { border-top: 1px solid var(--divider); border-radius: 0; }
  .song.sel { background: var(--bg-surface-hover); border-radius: 10px; }
  .song .n { font-family: var(--family-mono); font-size: 12px; color: var(--dim); text-align: right; }
  .song .t { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song .meta .ok { color: #7dd3a0; font-weight: 700; }
  .song .meta { grid-column: 2; font-size: 12px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song .acts { grid-row: 1 / span 2; grid-column: 3; display: flex; gap: 2px; }
  .ib { width: 30px; height: 30px; border-radius: 8px; border: 0; background: transparent; color: var(--soft); display: grid; place-items: center; font-size: 14px; }
  .ib:hover { background: rgb(255 255 255 / 0.07); color: var(--text); }
  .ib:disabled { opacity: .3; cursor: default; background: transparent; }
  .ib.play { color: #ff6c40; }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .02em; border-radius: 999px; padding: 1px 8px; border: 1px solid var(--divider-strong); color: var(--soft); }
  .pill.ok { color: #7dd3a0; border-color: rgb(125 211 160 / .4); } .pill.busy { color: #ffb38a; border-color: rgb(255 108 64 / .45); } .pill.bad { color: #ff8a8a; border-color: rgb(255 120 120 / .45); }
  .player { border-top: 1px solid var(--divider); padding: 10px 12px; display: flex; align-items: center; gap: 10px; }
  .player .now { flex: 1 1 auto; min-width: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg { display: inline-flex; padding: 3px; border: 1px solid var(--divider-strong); border-radius: 999px; gap: 2px; flex: none; }
  .seg button { border: 0; background: transparent; color: var(--soft); font-size: 13px; font-weight: 700; padding: 4px 11px; border-radius: 999px; }
  .seg button.on { background: #ff3b00; color: #fff; }
  .seg button:disabled { opacity: .35; cursor: default; }

  /* the steps */
  .steps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; padding: 10px; border-bottom: 1px solid var(--divider); }
  .step { text-align: left; border: 1px solid var(--divider); background: transparent; border-radius: 11px; padding: 7px 10px; min-width: 0; }
  .step:hover { border-color: var(--soft); }
  .step .k { display: flex; align-items: center; gap: 7px; font-weight: 800; font-size: 14px; }
  .step .num { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; background: var(--bg-surface-strong); color: var(--soft); flex: none; }
  .step .b { display: block; font-size: 11.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step.on { border-color: #ff3b00; background: rgb(255 59 0 / 0.1); }
  .step.done .num { background: #2f7a52; color: #fff; } .step.skipped .num { background: var(--bg-surface-strong); color: var(--dim); }
  .step.busy .num { background: #ff3b00; color: #fff; }
  .body { padding: 16px 18px; }
  .body h3 { margin: 0 0 4px; font-size: 20px; letter-spacing: -0.01em; }
  .lede { color: var(--soft); margin: 0 0 14px; font-size: 14px; max-width: 70ch; }
  .foot { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--divider); }
  .foot .status { flex: 1 1 auto; min-width: 0; font-size: 13px; color: var(--soft); }
  .btn { border: 1px solid var(--divider-strong); background: transparent; border-radius: 999px; padding: 8px 18px; font-weight: 700; font-size: 14px; min-height: 40px; }
  .btn:hover { border-color: var(--soft); }
  .btn.go { background: #ff3b00; border-color: #ff3b00; color: #fff; }
  .btn.go:hover { background: #ff5a26; }
  .btn:disabled { opacity: .4; cursor: default; }
  .label { font-size: 12px; font-weight: 700; color: var(--soft); letter-spacing: .02em; margin: 14px 0 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--divider-strong); background: transparent; border-radius: 10px; padding: 6px 11px; text-align: left; }
  .chip b { display: block; font-size: 14px; } .chip span { display: block; font-size: 11.5px; color: var(--dim); }
  .chip.on { border-color: #ff3b00; background: rgb(255 59 0 / 0.12); box-shadow: inset 0 0 0 1px #ff3b00; }
  .row { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  input[type=range] { accent-color: #ff3b00; width: 220px; }
  .switch { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--divider-strong); border-radius: 12px; cursor: pointer; }
  .switch input { margin-top: 4px; accent-color: #ff3b00; width: 18px; height: 18px; }
  .switch b { display: block; } .switch span { color: var(--soft); font-size: 13px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px 12px; }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: var(--soft); }
  label.f input, label.f select, td input { background: var(--bg-subtle-default); border: 1px solid var(--divider-strong); border-radius: 8px; padding: 7px 9px; font-size: 14px; font-weight: 400; color: var(--text); width: 100%; min-width: 0; }
  label.f input:focus, td input:focus { outline: 2px solid #ff3b00; outline-offset: -1px; }
  .detailsGrid { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 16px; }
  .cover { width: 150px; height: 150px; border: 1.5px dashed var(--divider-strong); border-radius: 12px; display: grid; place-items: center; text-align: center; font-size: 12.5px; color: var(--dim); cursor: pointer; overflow: hidden; padding: 8px; }
  .cover img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
  .cover.over { border-color: #ff3b00; }
  table.tracks { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.tracks th { text-align: left; font-size: 11.5px; color: var(--soft); font-weight: 700; padding: 4px 6px; }
  table.tracks td { padding: 3px 6px; vertical-align: middle; }
  table.tracks td.n { font-family: var(--family-mono); color: var(--dim); width: 28px; text-align: right; }
  table.tracks td input { padding: 5px 7px; font-size: 13px; }
  table.tracks td.x { width: 60px; text-align: center; }
  .verdict { border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; border: 1px solid var(--divider-strong); }
  .verdict b { font-size: 17px; display: block; }
  .verdict.ready { border-color: rgb(125 211 160 / .5); background: rgb(47 122 82 / .14); }
  .verdict.notes { border-color: rgb(255 179 138 / .5); background: rgb(255 108 64 / .08); }
  .verdict.fix { border-color: rgb(255 120 120 / .55); background: rgb(220 50 50 / .1); }
  details.res { border: 1px solid var(--divider); border-radius: 10px; margin-bottom: 6px; }
  details.res summary { cursor: pointer; padding: 8px 12px; display: flex; gap: 10px; align-items: center; font-weight: 700; }
  details.res summary::-webkit-details-marker { display: none; }
  .check { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 2px 10px; padding: 7px 12px; border-top: 1px solid var(--divider); font-size: 13px; }
  .check .st { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; padding-top: 2px; }
  .st.pass { color: #7dd3a0; } .st.note { color: var(--soft); } .st.warn { color: #ffb38a; } .st.fail { color: #ff8a8a; }
  .check .fix { color: var(--soft); }
  .formats { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
  .bar2 { height: 6px; border-radius: 3px; background: var(--bg-surface-strong); overflow: hidden; margin-top: 10px; }
  .bar2 i { display: block; height: 100%; width: 0; background: #ff3b00; transition: width .2s; }
  .note { font-size: 13px; color: var(--soft); margin-top: 10px; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #ff3b00; color: #fff; font-weight: 700; padding: 10px 18px; border-radius: 999px; z-index: 50; box-shadow: 0 8px 30px rgb(0 0 0 / .4); }

  /* a phone: one screen too. The steps on top; on Songs the list fills the rest, on the other steps the step does */
  @media (max-width: 899px) {
    main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); height: calc(100dvh - 60px); padding: 10px; gap: 10px; }
    main.atSongs { grid-template-rows: auto minmax(0, 1fr); }
    main.atSongs .stepPanel { order: -1; } main.atSongs .stepPanel .body { display: none; }
    .drop { margin: 10px; padding: 10px 12px; }
    .body { padding: 12px 14px; } .body h3 { font-size: 18px; } .lede { font-size: 13.5px; }
    .foot { padding: 8px 10px; } .btn { padding: 7px 14px; }
    #styles { display: grid; grid-template-columns: 1fr 1fr; } #styles .chip span { display: none; }
    .song .meta { white-space: normal; }
    .steps { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; padding: 8px; }
    .step { padding: 6px 4px; text-align: center; } .step .k { justify-content: center; font-size: 12px; gap: 4px; flex-direction: column; } .step .b { display: none; }
    .songsPanel.away { display: none; }
    .detailsGrid { grid-template-columns: minmax(0, 1fr); }
    table.tracks .opt { display: none; }
    input[type=range] { width: 100%; }
  }
</style>

<main>
  <section class="panel songsPanel" id="songsPanel" aria-label="Your songs">
    <div class="head"><h2 id="songsHead">Your songs</h2><span class="small dim" id="kind"></span></div>
    <label class="drop" id="drop">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <div><b>Drop your finished mixes here</b><span>One song for a single, a few for an EP or a whole album. WAV, FLAC, MP3, Apple Lossless and more.</span></div>
      <input type="file" id="files" multiple hidden>
    </label>
    <ul class="songs scroll" id="songs"></ul>
    <div class="player">
      <button class="ib play" id="playBtn" aria-label="Play" disabled>&#9654;</button>
      <div class="now" id="nowPlaying"><span class="dim">Pick a song to listen</span></div>
      <div class="seg" id="abSeg" aria-label="Listen to"><button data-v="orig" class="on">Mix</button><button data-v="master" disabled>Master</button></div>
      <audio id="audio" preload="auto"></audio>
    </div>
  </section>

  <section class="panel stepPanel" aria-label="Your release">
    <nav class="steps" id="steps" aria-label="Steps"></nav>
    <div class="scroll body" id="body"></div>
    <div class="foot">
      <button class="btn" id="backBtn">Back</button>
      <div class="status" id="status" aria-live="polite"></div>
      <button class="btn go" id="nextBtn">Next</button>
    </div>
  </section>
</main>
