<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--family-primary); -webkit-font-smoothing: antialiased; }
  .hidden { display: none !important; }
  .bar { position: sticky; top: 0; z-index: 10; height: 60px; display: flex; align-items: center; gap: 14px; padding: 0 clamp(16px, 2.5vw, 32px);
         background: rgb(12 10 9 / 0.94); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--divider); }
  .wordmark { height: 24px; width: auto; color: var(--text); display: block; flex: none; }
  .chip-label { font-size: 11px; letter-spacing: .06em; color: var(--soft); border: 1px solid var(--divider-strong); border-radius: 4px; padding: 3px 6px; line-height: 1; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .muted { color: var(--soft); } .dim { color: var(--dim); } .small { font-size: 12.5px; }

  main { max-width: 1680px; margin: 0 auto; padding: 12px 14px 14px; display: grid; grid-template-columns: 210px minmax(0, 1fr) 330px; gap: 12px; height: calc(100vh - 60px); height: calc(100dvh - 60px); }
  .panel { background: var(--panel); border: 1px solid var(--divider); border-radius: 14px; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--divider); }
  .head h2 { margin: 0; font-size: 15px; font-weight: 800; flex: 1 1 auto; }
  .scroll { overflow-y: auto; min-height: 0; flex: 1 1 auto; }
  .btn { border: 1px solid var(--divider-strong); background: transparent; border-radius: 999px; padding: 6px 13px; font-weight: 700; font-size: 13px; min-height: 34px; white-space: nowrap; }
  .btn:hover { border-color: var(--soft); }
  .btn.go { background: #ff3b00; border-color: #ff3b00; color: #fff; }
  .btn.sm { min-height: 28px; padding: 3px 10px; font-size: 12.5px; }
  .btn.rec { color: #ff6b6b; border-color: rgb(255 107 107 / .5); }
  .btn.rec.on { background: #e5383b; border-color: #e5383b; color: #fff; }
  .btn.on { background: #ff3b00; border-color: #ff3b00; color: #fff; }
  .ib { width: 34px; height: 34px; border: 1px solid var(--divider-strong); background: transparent; color: var(--text); border-radius: 9px; display: inline-grid; place-items: center; font-size: 15px; flex: none; }
  .ib:hover { border-color: #ff6c40; }
  .ib.on { background: #ff3b00; border-color: #ff3b00; color: #fff; }
  .ib:disabled { opacity: .35; cursor: default; }
  input.t, select.t { background: var(--bg-subtle-default); border: 1px solid var(--divider-strong); border-radius: 8px; padding: 5px 8px; font-size: 13.5px; min-width: 0; }
  input.t:focus, select.t:focus { outline: 2px solid #ff3b00; outline-offset: -1px; }

  /* library */
  .scoreRow { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 10px; border-radius: 9px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .scoreRow:hover { background: rgb(255 255 255 / .05); }
  .scoreRow.on { background: rgb(255 59 0 / .14); box-shadow: inset 2px 0 0 #ff3b00; }
  .scoreRow .d { display: block; font-size: 11.5px; color: var(--dim); }
  .lib { padding: 6px; }

  /* the score */
  .tool { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--divider); }
  .tool .sep { width: 1px; height: 24px; background: var(--divider-strong); margin: 0 2px; }
  .tool label { display: inline-flex; gap: 5px; align-items: center; font-size: 12px; font-weight: 700; color: var(--soft); }
  .tool .pos { margin-left: auto; font-family: var(--family-mono); font-size: 12px; color: var(--soft); }
  .paper { padding: 10px 14px 30px; color: #f2efe8; position: relative; outline: none; -webkit-user-select: none; user-select: none; }
  .paper.dragging, .paper.dragging * { cursor: grabbing !important; }
  .paper g.ghost { pointer-events: none; }
  .paper:focus-visible { box-shadow: inset 0 0 0 2px rgb(255 59 0 / .4); border-radius: 8px; }
  @font-face { font-family: "Bravura"; src: url("vendor/bravura/Bravura.woff2") format("woff2"); font-display: block; }
  .paper svg { display: block; }
  /* the page view: white Letter pages with margins on a dark desk, like a printed score */
  .paper.pages { display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 24px 16px 48px; color: #14110f; }
  .paper.pages:focus-visible { box-shadow: none; }
  .paper.pages .page { position: relative; box-sizing: border-box; flex: none; background: #fffefa; border-radius: 2px; box-shadow: 0 1px 2px rgb(0 0 0 / .5), 0 10px 28px rgb(0 0 0 / .45); }
  .paper.pages .page svg { overflow: visible; }
  .paper.pages .pnum { position: absolute; bottom: 22px; left: 0; right: 0; text-align: center; font: 500 12px "EB Garamond", Georgia, serif; color: #6b625a; }
  .light .paper { background: #f6f3ec; color: #14110f; border-radius: 10px; }
  .count { position: absolute; inset: 0; display: grid; place-items: center; font-size: 120px; font-weight: 800; color: #ff3b00; pointer-events: none; text-shadow: 0 4px 30px rgb(0 0 0 / .5); }
  /* the on-screen piano */
  .pianoWrap { border-top: 1px solid var(--divider); padding: 6px 10px 8px; display: flex; gap: 8px; align-items: center; }
  .piano { flex: 1 1 auto; height: 112px; position: relative; user-select: none; touch-action: none; overflow: hidden; border-radius: 6px; background: #0c0a09; }
  .piano .wk, .piano .bk { position: absolute; top: 0; border-radius: 0 0 6px 6px; cursor: pointer; box-sizing: border-box; }
  .piano .wk { height: 100%; background: linear-gradient(#e9e4da, #f6f3ec 18%, #f2efe8); border: 1px solid #0c0a09; border-top: 0; box-shadow: inset 0 -5px 0 #d9d2c5; }
  .piano .wk:active, .piano .wk.on { background: #ff8a5c; box-shadow: inset 0 -2px 0 #e0602f; }
  .piano .bk { height: 62%; background: linear-gradient(#2a2420, #14110f 85%); z-index: 2; border: 1px solid #0c0a09; border-top: 0; box-shadow: inset 0 -4px 0 #3a332e, 0 2px 3px rgb(0 0 0 / .45); }
  .piano .bk:active, .piano .bk.on { background: #ff3b00; box-shadow: none; }
  .piano .wk span { position: absolute; bottom: 9px; left: 0; right: 0; text-align: center; font-size: 11px; font-weight: 700; color: #8a8076; }
  .oct { display: flex; flex-direction: column; gap: 4px; }
  .oct .ib { width: 28px; height: 28px; font-size: 12px; }

  /* side tabs */
  .ttabs { display: flex; gap: 2px; padding: 6px; border-bottom: 1px solid var(--divider); }
  .ttabs button { flex: 1 1 0; border: 0; background: transparent; color: var(--soft); font-weight: 800; font-size: 13.5px; padding: 7px 4px; border-radius: 9px; }
  .ttabs button.on { background: #ff3b00; color: #fff; }
  .tbody { padding: 10px 12px 16px; }
  .lbl { font-size: 11.5px; font-weight: 800; color: var(--soft); letter-spacing: .04em; text-transform: uppercase; margin: 12px 0 6px; display: flex; justify-content: space-between; gap: 6px; }
  .lbl:first-child { margin-top: 2px; }
  .lbl .dim { text-transform: none; letter-spacing: 0; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 5px; }
  .pal { height: 46px; border: 1px solid var(--divider-strong); background: var(--bg-subtle-default); border-radius: 9px; display: grid; place-items: center; font-size: 13px; font-weight: 800; position: relative; }
  .pal svg { width: 26px; height: 32px; color: var(--text); }
  .pal kbd { position: absolute; right: 3px; bottom: 1px; font: 9.5px var(--family-mono); color: var(--dim); }
  .pal.on { background: #ff3b00; border-color: #ff3b00; color: #fff; } .pal.on svg { color: #fff; } .pal.on kbd { color: #ffe1d6; }
  .pal:hover { border-color: #ff6c40; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .form label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; font-weight: 700; color: var(--soft); }
  .form label.wide { grid-column: span 2; }
  .form > label { min-width: 0; } .form input.t, .form select.t { width: 100%; }
  .keys { font-size: 12.5px; color: var(--soft); line-height: 1.7; }
  .keys kbd { font: 11px var(--family-mono); border: 1px solid var(--divider-strong); border-radius: 4px; padding: 0 4px; color: var(--text); }
  .meter { height: 6px; border-radius: 3px; background: var(--bg-surface-strong); overflow: hidden; } .meter i { display: block; height: 100%; width: 0; background: #ff3b00; }
  .note { font-size: 12.5px; color: var(--soft); margin-top: 8px; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #ff3b00; color: #fff; font-weight: 700; padding: 9px 18px; border-radius: 999px; z-index: 50; box-shadow: 0 8px 30px rgb(0 0 0 / .4); }
  .mtabs { display: none; }
  .seg { display: inline-flex; padding: 3px; border: 1px solid var(--divider-strong); border-radius: 999px; gap: 2px; flex: none; }
  .seg button { border: 0; background: transparent; color: var(--soft); font-size: 12.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
  .seg button.on { background: #ff3b00; color: #fff; }
  .ib.sm { width: 26px; height: 26px; font-size: 11.5px; font-weight: 800; border-radius: 7px; }
  .partRow { border: 1px solid var(--divider); border-radius: 10px; padding: 7px; margin-bottom: 6px; display: grid; gap: 5px; cursor: pointer; }
  .partRow.on { border-color: #ff3b00; }
  .partRow > select { width: 100%; }
  .partRow .row { gap: 4px; } .partRow .row select { padding: 3px 5px; font-size: 12px; }
  .linkish { border: 0; background: transparent; color: inherit; text-decoration: underline; padding: 0; font: inherit; }
  .printPart { display: none; }
  .find { border: 1px solid var(--divider); border-left-width: 3px; border-radius: 9px; padding: 7px 9px; margin-bottom: 5px; font-size: 13px; cursor: pointer; display: grid; gap: 3px; }
  .find.error { border-left-color: #ff6b6b; } .find.warn { border-left-color: #ffb38a; } .find.tip { border-left-color: var(--divider-strong); }
  .find:hover { background: rgb(255 255 255 / .03); } .find .btn { justify-self: start; }
  .harm { display: flex; flex-wrap: wrap; gap: 4px; } .hb { border: 1px solid var(--divider); border-radius: 7px; padding: 2px 7px; font-size: 13px; }
  .ttabs button { font-size: 12.5px; padding: 7px 2px; }
  .sr { position: fixed; top: 0; left: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .tool kbd, .palItem kbd, .note kbd { font: 10.5px var(--family-mono); border: 1px solid var(--divider-strong); border-radius: 4px; padding: 0 4px; margin-left: 6px; color: var(--soft); }
  .modalBack { position: fixed; inset: 0; z-index: 80; background: rgb(0 0 0 / .55); display: grid; place-items: start center; padding-top: 10vh; }
  .modal { width: min(640px, calc(100vw - 24px)); max-height: 80vh; overflow: auto; background: var(--panel); border: 1px solid var(--divider-strong); border-radius: 16px; padding: 16px; box-shadow: 0 20px 60px rgb(0 0 0 / .5); }
  .modal h2 { margin: 0 0 10px; font-size: 18px; }
  .palIn { width: 100%; font-size: 17px; padding: 10px 12px; }
  .palList { margin-top: 8px; display: grid; gap: 2px; }
  .palItem { padding: 8px 10px; border-radius: 9px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .palItem.on, .palItem:hover { background: rgb(255 59 0 / .15); }
  .tpls { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; }
  .tpl { text-align: left; border: 1px solid var(--divider-strong); background: transparent; border-radius: 11px; padding: 8px 10px; }
  .tpl b { display: block; font-size: 14px; } .tpl span { display: block; font-size: 12px; color: var(--dim); }
  .tpl.on { border-color: #ff3b00; background: rgb(255 59 0 / .12); box-shadow: inset 0 0 0 1px #ff3b00; }
  .histRow { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--divider); font-size: 13.5px; }
  @media (max-width: 899px) { #sayBtn kbd { display: none; } }
  @media print { body.printingPart > *:not(.printPart) { display: none !important; } body.printingPart .printPart { display: block; color: #000; } }

  @media (max-width: 1150px) { main { grid-template-columns: 170px minmax(0, 1fr) 300px; } }
  @media (max-width: 899px) {
    main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: calc(100dvh - 60px); padding: 8px; gap: 8px; }
    .mtabs { display: flex; gap: 4px; }
    .mtabs button { flex: 1 1 0; border: 1px solid var(--divider-strong); background: transparent; color: var(--soft); border-radius: 10px; padding: 7px; font-weight: 800; }
    .mtabs button.on { background: #ff3b00; border-color: #ff3b00; color: #fff; }
    main > .panel { display: none; } main[data-m="lib"] #libPanel, main[data-m="score"] #scorePanel, main[data-m="tools"] #toolPanel { display: flex; }
    .tool .pos { display: none; } .piano { height: 84px; }
  }
  @media print {
    .bar, #libPanel, #toolPanel, .mtabs, .tool, .pianoWrap { display: none !important; }
    body { background: #fff; } main { display: block; height: auto; padding: 0; } .panel { border: 0; background: #fff; }
    .paper { color: #000 !important; background: #fff !important; padding: 0; } .scroll { overflow: visible; }
    .paper.pages { display: block; padding: 0; gap: 0; } .paper.pages .page { box-shadow: none; border-radius: 0; break-after: page; margin: 0 auto; }
  }
</style>

<main data-m="score">
  <div class="mtabs" id="mtabs"><button data-m="lib">Scores</button><button data-m="score" class="on">Score</button><button data-m="tools">Tools</button></div>

  <section class="panel" id="libPanel" aria-label="Your scores">
    <div class="head"><h2>Compose</h2><button class="btn sm go" id="newScore">+ New</button></div>
    <div class="scroll lib" id="lib"></div>
  </section>

  <section class="panel" id="scorePanel" aria-label="The score">
    <div class="tool">
      <button class="ib" id="playBtn" title="Play from the cursor (Space)" aria-label="Play">&#9654;</button>
      <button class="btn sm rec" id="recBtn" title="Record from a MIDI keyboard, the piano below, or your computer keys, with a click">&#9679; Record</button>
      <button class="ib" id="loopBtn" title="Loop the selected run (L)" aria-label="Loop">&#10227;</button>
      <button class="ib" id="clickBtn" title="Metronome click while playing and recording" aria-label="Metronome">&#9833;</button>
      <label>Tempo <input class="t" id="tempo" type="number" min="20" max="320" style="width:64px" aria-label="Tempo"></label>
      <span class="sep"></span>
      <button class="ib" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo">&#8630;</button>
      <button class="ib" id="redoBtn" title="Redo (Ctrl+Y)" aria-label="Redo">&#8631;</button>
      <span class="sep"></span>
      <button class="ib" id="transDown" title="Transpose the whole piece down a half step" aria-label="Transpose down">&#8722;</button>
      <button class="ib" id="transUp" title="Transpose the whole piece up a half step" aria-label="Transpose up">+</button>
      <span class="seg" id="modeSeg" title="Insert pushes later music along; Over writes over what's there, so other parts stay lined up"><button data-v="insert">Insert</button><button data-v="overwrite">Over</button></span>
      <label class="hidden" id="writtenWrap"><input type="checkbox" id="written"> Written pitch</label>
      <button class="btn sm" id="sayBtn" title="Type a mark (pp, cresc., Cmaj7, 3/4, rit.) or find any command">Type it&hellip; <kbd>Ctrl K</kbd></button>
      <span class="pos" id="pos"></span>
    </div>
    <div class="scroll" id="paperScroll"><div class="paper" id="paper" tabindex="0" aria-label="Score. Type notes A to G, numbers for lengths, arrows to move."></div></div>
    <div class="pianoWrap">
      <div class="oct"><button class="ib" id="octUp" title="Higher" aria-label="Piano up an octave">&#9650;</button><button class="ib" id="octDown" title="Lower" aria-label="Piano down an octave">&#9660;</button></div>
      <div class="piano" id="piano" aria-label="Piano: tap to put a note in"></div>
    </div>
  </section>

  <section class="panel" id="toolPanel" aria-label="Tools">
    <div class="ttabs" id="ttabs"><button data-t="write" class="on">Write</button><button data-t="bar">Bar</button><button data-t="record">Record</button><button data-t="score">Score</button><button data-t="check">Check</button><button data-t="share">Share</button></div>
    <div class="scroll tbody" id="tbody"></div>
  </section>
</main>
<input type="file" id="importFile" accept=".musicxml,.xml,.mxl,application/vnd.recordare.musicxml+xml,.json" hidden>
<div id="sr" class="sr" aria-live="polite"></div>
<script type="module" src="compose.js"></script>
</body>
</html>
