<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--family-primary); -webkit-font-smoothing: antialiased; }
  .hidden { display: none !important; }
  .bar { position: sticky; top: 0; z-index: 10; height: 60px; display: flex; align-items: center; gap: 14px; padding: 0 clamp(16px, 2.5vw, 32px);
         background: rgb(12 10 9 / 0.94); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--divider); }
  .wordmark { height: 24px; width: auto; color: var(--text); display: block; flex: none; }
  .chip-label { font-size: 11px; letter-spacing: .06em; color: var(--soft); border: 1px solid var(--divider-strong); border-radius: 4px; padding: 3px 6px; line-height: 1; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .muted { color: var(--soft); } .dim { color: var(--dim); } .small { font-size: 12.5px; }

  /* one screen: the library, the song, the tools */
  /* the song column keeps its size: the side panels take whatever room the screen has past 1600px, split evenly */
  main { --e: max(0px, (100vw - 1600px) / 2); padding: 12px 14px 14px; display: grid; grid-template-columns: calc(240px + var(--e)) minmax(0, 1fr) calc(380px + var(--e)); gap: 12px; height: calc(100vh - 60px); }
  .panel { background: var(--panel); border: 1px solid var(--divider); border-radius: 14px; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--divider); }
  .head h2 { margin: 0; font-size: 15px; font-weight: 800; flex: 1 1 auto; }
  .scroll { overflow-y: auto; min-height: 0; flex: 1 1 auto; }
  .btn { border: 1px solid var(--divider-strong); background: transparent; border-radius: 999px; padding: 6px 13px; font-weight: 700; font-size: 13px; min-height: 34px; white-space: nowrap; }
  .btn:hover { border-color: var(--soft); }
  .btn.go { background: #ff3b00; border-color: #ff3b00; color: #fff; }
  .btn.sm { min-height: 28px; padding: 3px 10px; font-size: 12.5px; }
  .ib { width: 30px; height: 30px; border: 0; background: transparent; color: var(--soft); border-radius: 8px; display: inline-grid; place-items: center; font-size: 15px; flex: none; }
  .ib:hover { background: rgb(255 255 255 / .07); color: var(--text); }
  .seg { display: inline-flex; padding: 3px; border: 1px solid var(--divider-strong); border-radius: 999px; gap: 2px; flex: none; }
  .seg button { border: 0; background: transparent; color: var(--soft); font-size: 13px; font-weight: 700; padding: 4px 11px; border-radius: 999px; }
  .seg button.on { background: #ff3b00; color: #fff; }
  input.t, select.t { background: var(--bg-subtle-default); border: 1px solid var(--divider-strong); border-radius: 8px; padding: 5px 8px; font-size: 13.5px; min-width: 0; }
  input.t:focus, select.t:focus, textarea:focus { outline: 2px solid #ff3b00; outline-offset: -1px; }

  /* library */
  .lib { padding: 6px; }
  .search { margin: 8px 10px 4px; width: calc(100% - 20px); }
  .folder { margin-top: 4px; }
  .fhead { display: flex; align-items: center; gap: 4px; padding: 4px 6px; border-radius: 8px; font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--soft); }
  .fhead .nm { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .fhead .ib { width: 24px; height: 24px; font-size: 13px; opacity: .7; }
  .fhead.drop { background: rgb(255 59 0 / .15); outline: 1px dashed #ff3b00; }
  .songrow { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 5px 8px 5px 14px; border-radius: 8px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .songrow:hover { background: rgb(255 255 255 / .05); }
  .songrow.on { background: rgb(255 59 0 / .14); color: #fff; box-shadow: inset 2px 0 0 #ff3b00; }
  .songrow .k { color: var(--dim); font-size: 12px; margin-left: 6px; }
  .collapsed .songrow { display: none; }
  .cat { margin-bottom: 6px; }
  .chead { display: flex; align-items: center; gap: 2px; padding: 6px 6px 2px; font-size: 11.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); border-radius: 8px; }
  .chead .nm { flex: 1 1 auto; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chead .ib { width: 22px; height: 22px; font-size: 13px; opacity: .6; } .chead:hover .ib { opacity: 1; }
  .chead.drop { background: rgb(255 59 0 / .15); outline: 1px dashed #ff3b00; }
  .cat.collapsed .cbody { display: none; }
  .cempty { font-size: 12px; color: var(--dim); padding: 2px 10px 6px; }
  .folder { border-left: 3px solid var(--fc, var(--divider-strong)); margin: 3px 0 3px 4px; border-radius: 0 8px 8px 0; }
  .fhead { text-transform: none; letter-spacing: 0; font-size: 13.5px; color: var(--text); font-weight: 700; cursor: grab; }
  .songrow .tn { display: inline-block; width: 20px; font: 11px var(--family-mono); color: var(--dim); }
  .songrow.dropBefore { box-shadow: inset 0 2px 0 #ff3b00; }
  .addcat { margin: 6px 8px 10px; }
  .menu { position: fixed; z-index: 60; background: var(--panel); border: 1px solid var(--divider-strong); border-radius: 12px; padding: 6px; display: grid; gap: 4px; min-width: 190px; box-shadow: 0 12px 40px rgb(0 0 0 / .5); }
  .menu > button { text-align: left; border: 0; background: transparent; padding: 7px 10px; border-radius: 8px; font-size: 14px; color: var(--text); }
  .menu > button:hover { background: rgb(255 255 255 / .06); } .menu .danger { color: #ff8a8a; }
  .menu label { display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--soft); padding: 4px 6px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 5px; padding: 4px 6px; }
  .sw { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--divider-strong); padding: 0; }
  .sw.on { outline: 2px solid #fff; outline-offset: 1px; }

  /* the song */
  .songHead { padding: 10px 14px 8px; border-bottom: 1px solid var(--divider); display: grid; gap: 6px; }
  .titleRow { display: flex; gap: 8px; align-items: center; }
  .titleIn { flex: 1 1 auto; min-width: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.01em; background: transparent; border: 0; padding: 2px 0; }
  .titleIn:focus { outline: none; box-shadow: 0 2px 0 #ff3b00; }
  .artistIn { width: 180px; background: transparent; border: 0; border-bottom: 1px solid var(--divider-strong); padding: 2px 0; color: var(--soft); }
  .tools2 { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; }
  .tools2 label { display: inline-flex; gap: 5px; align-items: center; color: var(--soft); font-weight: 700; font-size: 12px; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .tag { font-size: 12px; border: 1px solid var(--divider-strong); border-radius: 999px; padding: 1px 4px 1px 9px; display: inline-flex; align-items: center; gap: 2px; }
  .tag button { border: 0; background: transparent; color: var(--dim); padding: 0 4px; }
  .parts { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .parts .pl { font-size: 12px; font-weight: 700; color: var(--soft); margin-right: 2px; }
  .pt { border: 1px solid var(--divider-strong); background: transparent; border-radius: 999px; padding: 2px 10px; font-size: 12.5px; font-weight: 700; color: var(--text); }
  .pt:hover { border-color: #ff6c40; color: #fff; }
  .pt.rep { border-style: dashed; color: #ff8a5c; }
  .parts select.t { padding: 2px 6px; font-size: 12.5px; }
  .write { flex: 1 1 auto; min-height: 0; width: 100%; resize: none; border: 0; background: transparent; padding: 14px 16px; font: 16px/1.7 var(--family-primary); color: var(--text); }
  .write:focus { outline: none; }
  .sheet { padding: 14px 18px 40px; font-size: 16px; }
  .sheet .sec { font-weight: 800; color: #ff6c40; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; margin: 16px 0 2px; display: flex; gap: 8px; align-items: center; }
  .sheet .sec:first-child { margin-top: 0; }
  .sheet .ln { display: flex; flex-wrap: wrap; align-items: flex-end; min-height: 50px; padding-right: 44px; position: relative; }
  .sheet .ln .syl { position: absolute; right: 0; bottom: 4px; font-family: var(--family-mono); font-size: 11px; color: var(--dim); }
  .sheet .gap { height: 14px; }
  .seg2 { display: inline-flex; flex-direction: column; }
  .seg2 .ch { font-weight: 800; color: #ff8a5c; min-height: 22px; font-size: 15px; padding-right: 8px; white-space: nowrap; cursor: pointer; border-radius: 5px; }
  .seg2 .ch:hover { background: rgb(255 59 0 / .15); }
  .seg2 .ch.sel { background: #ff3b00; color: #fff; padding: 0 4px; }
  .seg2 .tx { white-space: pre; }
  .w { cursor: text; border-radius: 4px; }
  .placing .w { cursor: copy; }
  .placing .w:hover { background: rgb(255 59 0 / .18); box-shadow: inset 0 2px 0 #ff3b00; }
  .w.pick { background: rgb(255 255 255 / .1); }
  .empty { color: var(--dim); padding: 30px 18px; text-align: center; }
  .hint { font-size: 12.5px; color: var(--dim); padding: 6px 14px; border-top: 1px solid var(--divider); display: flex; gap: 10px; align-items: center; }
  .hint b { color: var(--soft); }

  /* tools */
  .ttabs { display: flex; gap: 2px; padding: 6px; border-bottom: 1px solid var(--divider); }
  .ttabs button { flex: 1 1 0; border: 0; background: transparent; color: var(--soft); font-weight: 800; font-size: 13.5px; padding: 7px 4px; border-radius: 9px; }
  .ttabs button.on { background: #ff3b00; color: #fff; }
  .tbody { padding: 10px 12px 16px; }
  .lbl { font-size: 11.5px; font-weight: 800; color: var(--soft); letter-spacing: .04em; text-transform: uppercase; margin: 12px 0 6px; display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .lbl:first-child { margin-top: 2px; }
  .lbl .dim { text-transform: none; letter-spacing: 0; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .cc { border: 1px solid var(--divider-strong); background: var(--bg-subtle-default); border-radius: 9px; padding: 3px 9px; font-weight: 800; font-size: 14px; display: inline-flex; flex-direction: column; align-items: center; line-height: 1.2; min-width: 42px; }
  .cc i { font-style: normal; font-size: 10px; font-weight: 700; color: var(--dim); }
  .cc:hover { border-color: #ff6c40; }
  .cc.armed { background: #ff3b00; border-color: #ff3b00; color: #fff; } .cc.armed i { color: #ffe1d6; }
  .cc.fn-T { box-shadow: inset 0 -2px 0 #7dd3a0; } .cc.fn-S { box-shadow: inset 0 -2px 0 #8ab4ff; } .cc.fn-D { box-shadow: inset 0 -2px 0 #ff8a5c; }
  .prog { border: 1px solid var(--divider); border-radius: 10px; padding: 7px 9px; margin-bottom: 6px; }
  .prog .row { display: flex; gap: 6px; align-items: center; }
  .prog input { flex: 1 1 auto; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .diagrams { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
  .dg { border: 1px solid var(--divider); border-radius: 10px; padding: 6px; text-align: center; cursor: pointer; }
  .dg:hover { border-color: #ff6c40; }
  .dg b { display: block; font-size: 15px; }
  .dg svg { width: 100%; height: auto; display: block; }
  .dg .alt { font-size: 11px; color: var(--dim); font-family: var(--family-mono); }
  .notes { font-family: var(--family-mono); font-size: 13px; margin-top: 4px; }
  .copies { display: grid; gap: 6px; }
  .copy { text-align: left; border: 1px solid var(--divider-strong); background: transparent; border-radius: 10px; padding: 8px 11px; }
  .copy:hover { border-color: #ff6c40; }
  .copy b { display: block; font-size: 14px; } .copy span { display: block; font-size: 12px; color: var(--dim); }
  pre.preview { font: 12px/1.45 var(--family-mono); background: var(--bg-subtle-default); border: 1px solid var(--divider); border-radius: 10px; padding: 8px 10px; max-height: 180px; overflow: auto; white-space: pre; }

  /* words */
  .wsearch { display: flex; gap: 6px; }
  .wsearch input { flex: 1 1 auto; font-size: 15px; padding: 7px 10px; }
  .wtabs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .wtabs button { border: 1px solid var(--divider-strong); background: transparent; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; font-weight: 700; color: var(--soft); }
  .wtabs button.on { background: #ff3b00; border-color: #ff3b00; color: #fff; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; font-size: 12.5px; color: var(--soft); }
  .filters input.t { width: 110px; padding: 4px 7px; font-size: 13px; }
  .filters select.t { padding: 4px 6px; font-size: 13px; }
  .chain { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .chain span { font-size: 12px; background: rgb(255 59 0 / .14); border: 1px solid rgb(255 59 0 / .4); border-radius: 999px; padding: 1px 4px 1px 9px; }
  .chain span button { border: 0; background: transparent; color: var(--soft); padding: 0 4px; }
  .results { margin-top: 8px; }
  .sylgroup { margin-top: 8px; }
  .sylgroup .lbl { margin: 6px 0 4px; }
  .wd { border: 0; background: transparent; padding: 2px 6px; border-radius: 6px; font-size: 14.5px; color: var(--text); }
  .wd:hover { background: rgb(255 59 0 / .16); }
  .wd.near { color: var(--soft); } .wd.guess { font-style: italic; }
  /* words: syllable tabs, an endless grid, what each word is */
  .syltabs { display: flex; gap: 2px; margin-top: 10px; border-bottom: 1px solid var(--divider-strong); position: sticky; top: -12px; background: var(--panel); z-index: 2; padding-top: 4px; }
  .syltabs button { flex: 1 1 0; border: 0; background: transparent; color: var(--soft); font-weight: 800; font-size: 14px; padding: 6px 4px 7px; border-bottom: 2px solid transparent; margin-bottom: -1px; display: flex; flex-direction: column; align-items: center; line-height: 1.15; }
  .syltabs button span { font-size: 11px; font-weight: 600; color: var(--dim); }
  .syltabs button.on { color: var(--text); border-bottom-color: #ff3b00; } .syltabs button:disabled { opacity: .35; cursor: default; }
  .wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 0 4px; margin-top: 6px; }
  .wgrid .wd { text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wd sup { font-size: 9.5px; color: var(--dim); margin-left: 2px; }
  .wd.rare, .legend .rare { color: var(--soft); } .wd.name, .legend .name { font-style: italic; } .wd.phr, .legend .phr { color: #fdba74; }
  .wd.near.phr { color: #c9a27e; } .hm { font-style: normal; color: #ff6c40; font-size: 11px; margin-left: 3px; font-weight: 800; }
  .legend { display: inline-flex; gap: 8px; margin-left: 6px; } .wmore { padding: 10px 6px 4px; }
  .sense { margin-top: 8px; font-size: 13px; }
  .sense .def { color: var(--soft); margin-bottom: 3px; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #ff3b00; color: #fff; font-weight: 700; padding: 9px 18px; border-radius: 999px; z-index: 50; box-shadow: 0 8px 30px rgb(0 0 0 / .4); }
  .mtabs { display: none; }

  @media (max-width: 1100px) { main { grid-template-columns: 210px minmax(0, 1fr) 330px; } }
  /* a phone: one panel at a time, picked from the row at the top */
  @media (max-width: 899px) {
    main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: calc(100dvh - 60px); padding: 8px; gap: 8px; }
    .mtabs { display: flex; gap: 4px; }
    .mtabs button { flex: 1 1 0; border: 1px solid var(--divider-strong); background: transparent; color: var(--soft); border-radius: 10px; padding: 7px; font-weight: 800; }
    .mtabs button.on { background: #ff3b00; border-color: #ff3b00; color: #fff; }
    main > .panel { display: none; } main[data-m="lib"] #libPanel, main[data-m="song"] #songPanel, main[data-m="tools"] #toolPanel { display: flex; }
    .titleRow { flex-wrap: wrap; } .titleIn { font-size: 19px; flex: 1 1 100%; } .artistIn { flex: 1 1 0; width: auto; min-width: 0; }
    .tools2 { gap: 6px; } #addInst { flex: 1 1 100%; }
    .parts { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; } .pt { flex: none; }
    .sheet { padding: 12px 12px 30px; } .sheet .ln { padding-right: 26px; }
  }
  /* cover and details, print */
  .coverBtn { width: 40px; height: 40px; flex: none; border-radius: 6px; border: 1px dashed var(--divider-strong); background: transparent; color: var(--dim); padding: 0; overflow: hidden; display: grid; place-items: center; font-size: 15px; }
  .coverBtn img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .coverBtn:hover { border-color: var(--soft); color: var(--text); }
  .fcov { width: 16px; height: 16px; object-fit: cover; border-radius: 2px; vertical-align: -3px; margin-right: 4px; }
  dialog.dlg { background: var(--panel); color: var(--text); border: 1px solid var(--divider-strong); border-radius: 14px; padding: 18px 20px; width: min(560px, 94vw); max-height: 92vh; overflow: auto; }
  dialog.dlg::backdrop { background: rgb(0 0 0 / .6); }
  dialog.dlg h3 { margin: 0 0 12px; font-size: 17px; }
  .dlg .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; } .dlg .row.end { justify-content: flex-end; margin-top: 14px; }
  .cv { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
  .cv img, .cv .none { width: 110px; height: 110px; object-fit: cover; border-radius: 8px; flex: none; }
  .cv img.inh { opacity: .55; } .cv .none { border: 1px dashed var(--divider-strong); display: grid; place-items: center; color: var(--dim); font-size: 12.5px; }
  .cvb { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .fl { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--soft); } .fl.wide { grid-column: 1 / -1; }
  .fl .t { width: 100%; font-size: 14px; color: var(--text); } .fl textarea.t { background: var(--bg-subtle-default); border: 1px solid var(--divider-strong); border-radius: 8px; padding: 6px 8px; resize: vertical; }
  dialog.printDlg { width: min(1240px, 96vw); height: 92vh; max-height: none; padding: 0; display: flex; overflow: hidden; }
  dialog.printDlg:not([open]) { display: none; }
  .pside { width: 300px; flex: none; padding: 16px 18px; overflow-y: auto; border-right: 1px solid var(--divider); display: flex; flex-direction: column; gap: 6px; }
  .pside h3 { margin: 0 0 4px; }
  .plbl { font-size: 11.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin-top: 8px; }
  .seg.wrap { flex-wrap: wrap; border-radius: 12px; } .seg button:disabled { opacity: .35; cursor: default; }
  .ck { display: flex; gap: 7px; align-items: center; font-size: 13.5px; }
  .pside .fl { margin-top: 6px; }
  .pview { flex: 1 1 auto; min-width: 0; background: #57534e; }
  .pview iframe { width: 100%; height: 100%; border: 0; display: block; }
  @media (max-width: 760px) { dialog.printDlg { flex-direction: column; height: 96vh; } .pside { width: auto; max-height: 46%; border-right: 0; border-bottom: 1px solid var(--divider); } .fgrid { grid-template-columns: 1fr; } }
  @media print {
    .bar, #libPanel, #toolPanel, .mtabs, .tools2, .parts, .hint, .songHead .titleRow .ib, #viewSeg { display: none !important; }
    body { background: #fff; color: #000; } main { display: block; height: auto; padding: 0; } .panel { border: 0; background: #fff; }
    .titleIn, .artistIn { color: #000; border: 0; } .sheet { padding: 0; } .seg2 .ch { color: #c2410c; } .sheet .sec { color: #c2410c; } .sheet .ln .syl { display: none; }
    .scroll { overflow: visible; }
  }
</style>

<main data-m="song">
  <div class="mtabs" id="mtabs" role="tablist"><button data-m="lib">Songs</button><button data-m="song" class="on">Song</button><button data-m="tools">Chords &amp; words</button></div>

  <section class="panel" id="libPanel" aria-label="Your songbook">
    <div class="head"><h2>Songbook</h2><button class="btn sm go" id="newSong">+ Song</button><button class="ib" id="newFolder" title="New folder" aria-label="New folder">&#128193;</button></div>
    <input class="t search" id="search" type="search" placeholder="Search your songs" aria-label="Search your songs">
    <div class="scroll lib" id="lib"></div>
    <div class="hint"><span>Drag songs to put them in order or into a folder. Drag a folder to another category.</span></div>
  </section>

  <section class="panel" id="songPanel" aria-label="The song">
    <div class="songHead">
      <div class="titleRow">
        <button class="coverBtn" id="coverBtn" aria-label="Cover and details"></button>
        <input class="titleIn" id="title" placeholder="Song title" aria-label="Song title" autocomplete="off">
        <input class="artistIn" id="artist" placeholder="Artist" aria-label="Artist" autocomplete="off">
        <button class="ib" id="printBtn" title="Print or PDF (Ctrl+P): this song, the album, or your whole songbook" aria-label="Print">&#128438;</button>
        <div class="seg" id="viewSeg" aria-label="View"><button data-v="write">Write</button><button data-v="sheet">Chords</button></div>
      </div>
      <div class="tools2">
        <label>Key <select class="t" id="key" aria-label="Key"></select></label>
        <label>Capo <select class="t" id="capo" aria-label="Capo"></select></label>
        <span class="seg" aria-label="Transpose"><button id="down" title="Down a half step" aria-label="Transpose down">&#8722;</button><button id="up" title="Up a half step" aria-label="Transpose up">+</button></span>
        <span class="seg" id="sideSeg" aria-label="Sharps or flats"><button data-v="-1" title="Flat names (Db)">&#9837;</button><button data-v="1" title="Sharp names (C#)">&#9839;</button></span>
        <button class="btn sm" id="quickFormat" title="Tidy pasted lyrics: sections, spacing, and chords written above the words moved into place">Quick format</button>
        <span class="tags" id="instTags"></span>
        <select class="t" id="addInst" aria-label="Tag an instrument"></select>
      </div>
      <div class="parts" id="parts" aria-label="Add a part of the song"></div>
    </div>
    <textarea class="write scroll" id="write" spellcheck="true" placeholder="Paste or type your lyrics.&#10;&#10;Put a chord in by tapping it on the right, or type it in brackets: [G]Here comes the [C]sun.&#10;Sections go on their own line: [Verse 1], [Chorus].&#10;&#10;Pasted a chord sheet with the chords above the words? Press Quick format."></textarea>
    <div class="sheet scroll hidden" id="sheet"></div>
    <div class="hint" id="hint"></div>
  </section>

  <section class="panel" id="toolPanel" aria-label="Chords, playing and words">
    <div class="ttabs" id="ttabs"><button data-t="chords" class="on">Chords</button><button data-t="play">Play</button><button data-t="words">Words</button><button data-t="share">Share</button></div>
    <div class="scroll tbody" id="tbody"></div>
  </section>
</main>
<input type="file" id="importFile" accept=".cho,.chopro,.chordpro,.crd,.pro,.txt,.json,text/plain,application/json" multiple hidden>
<script type="module" src="songbook.js"></script>
